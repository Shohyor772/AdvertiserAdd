name: Validate marketplace
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ci-local-only
      DEBUG: 'true'
      PAYMENT_MODE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv venv
      - run: venv/bin/pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: venv/bin/python scripts/prepare_e2e.py
      - run: venv/bin/python manage.py collectstatic --noinput
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: tmp/playwright-report
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blogger-ci .
      - run: docker run -d --name marketplace-ci -p 127.0.0.1:8003:8000 -e DEBUG=true -e PAYMENT_MODE=test -e ALLOWED_HOSTS=127.0.0.1,localhost blogger-ci
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8003/health/
      - run: docker logs marketplace-ci
        if: always()
