services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./backups:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./backups:/app/backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  beat:
    build: .
    command: celery -A config beat --loglevel=info --schedule=/schedule/celerybeat
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - beat_schedule:/schedule
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  db:
    profiles: [postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  redis_data:
  postgres_data:
  beat_schedule:
