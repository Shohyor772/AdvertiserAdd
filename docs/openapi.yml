components:
  schemas:
    AccountTypeEnum:
      enum:
      - person
      - company
      type: string
      description: |-
        * `person` - Физлицо
        * `company` - Юрлицо
    ActionEnum:
      enum:
      - accept
      - reject
      - counter
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
        * `counter` - counter
    Blogger:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        platform:
          type: string
          maxLength: 50
        subscribers:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        category:
          type: string
          maxLength: 100
        is_verified:
          type: boolean
          readOnly: true
        city:
          type: string
          maxLength: 120
        bio:
          type: string
        channel_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        views:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        engagement_rate:
          type: number
          format: double
          maximum: 100
          minimum: 0
        female_percent:
          type: integer
          maximum: 100
          minimum: 0
        age_min:
          type: integer
          maximum: 100
          minimum: 0
        age_max:
          type: integer
          maximum: 100
          minimum: 0
        forbidden_topics:
          type: string
        fraud_status:
          type: string
          readOnly: true
        stats_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rating:
          type: number
          format: double
          nullable: true
          readOnly: true
        review_count:
          type: integer
          readOnly: true
        cpm:
          type: number
          format: double
          nullable: true
          readOnly: true
      required:
      - cpm
      - display_name
      - fraud_status
      - id
      - is_verified
      - rating
      - review_count
      - stats_updated_at
      - user_id
      - username
    Campaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        description:
          type: string
        category:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 120
        budget:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        starts_at:
          type: string
          format: date
        ends_at:
          type: string
          format: date
        min_subscribers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        female_percent:
          type: integer
          maximum: 100
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        advertiser:
          type: integer
          readOnly: true
        matched_bloggers:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - advertiser
      - budget
      - category
      - created_at
      - description
      - ends_at
      - id
      - matched_bloggers
      - starts_at
      - title
    CampaignRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          maxLength: 120
        budget:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        starts_at:
          type: string
          format: date
        ends_at:
          type: string
          format: date
        min_subscribers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        female_percent:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - budget
      - category
      - description
      - ends_at
      - starts_at
      - title
    CategoryAnalytics:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
        average_cpm:
          type: number
          format: double
        average_price:
          type: number
          format: double
      required:
      - average_cpm
      - average_price
      - category
      - count
    Deal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        proposal:
          type: integer
          readOnly: true
        amount:
          type: integer
          readOnly: true
        commission:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DealStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        publication_url:
          type: string
          format: uri
          readOnly: true
        revision_reason:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        payment_status:
          type: string
          nullable: true
          readOnly: true
        is_test:
          type: boolean
          nullable: true
          readOnly: true
      required:
      - amount
      - commission
      - completed_at
      - id
      - is_test
      - payment_status
      - proposal
      - publication_url
      - revision_reason
      - status
      - status_label
      - submitted_at
    DealStatusEnum:
      enum:
      - awaiting_payment
      - in_progress
      - submitted
      - revision
      - disputed
      - completed
      - refunded
      type: string
      description: |-
        * `awaiting_payment` - Ожидает оплаты
        * `in_progress` - В работе
        * `submitted` - На приёмке
        * `revision` - Доработка
        * `disputed` - Спор
        * `completed` - Завершена
        * `refunded` - Возврат
    Dispute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reason:
          type: string
        decision:
          allOf:
          - $ref: '#/components/schemas/DisputeDecisionEnum'
          readOnly: true
        resolution:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deal:
          type: integer
          readOnly: true
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - deal
      - decision
      - id
      - reason
      - resolution
      - resolved_at
      - resolved_by
    DisputeDecisionEnum:
      enum:
      - blogger
      - advertiser
      type: string
      description: |-
        * `blogger` - В пользу блогера
        * `advertiser` - В пользу рекламодателя
    DisputeDecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DisputeDecisionEnum'
        resolution:
          type: string
          minLength: 1
      required:
      - decision
      - resolution
    DisputeRequest:
      type: object
      properties:
        evidence:
          type: string
          format: binary
          writeOnly: true
        reason:
          type: string
          minLength: 1
      required:
      - reason
    EmailTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    LogoutRequest:
      type: object
