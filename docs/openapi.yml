  /api/bloggers/:
    get:
      operationId: bloggers_list
      parameters:
      - in: query
        name: age_max
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - in: query
        name: age_min
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - in: query
        name: category
        schema:
          type: string
          maxLength: 100
      - in: query
        name: city
        schema:
          type: string
          maxLength: 120
      - in: query
        name: female_percent
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - in: query
        name: male_percent
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - in: query
        name: ordering
        schema:
          enum:
          - price
          - -price
          - subscribers
          - -subscribers
          - -rating
          - rating
          - username
          type: string
          minLength: 1
        description: |-
          * `price` - price
          * `-price` - -price
          * `subscribers` - subscribers
          * `-subscribers` - -subscribers
          * `-rating` - -rating
          * `rating` - rating
          * `username` - username
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: platform
        schema:
          type: string
          maxLength: 50
      - in: query
        name: price_max
        schema:
          type: integer
          minimum: 0
      - in: query
        name: price_min
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          maxLength: 120
      - in: query
        name: subscribers_max
        schema:
          type: integer
          minimum: 0
      - in: query
        name: subscribers_min
        schema:
          type: integer
          minimum: 0
      - in: query
        name: verified
        schema:
          type: boolean
      tags:
      - bloggers
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBloggerList'
          description: ''
