        id:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        text:
          type: string
        attachment_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_name
      - created_at
      - id
      - sender
      - sender_name
    MessageRequest:
      type: object
      properties:
        text:
          type: string
        attachment:
